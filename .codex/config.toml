# Allow local edits inside the workspace, but keep approvals on for anything
# outside Codex's trusted command set.
approval_policy = "never"

# Permit file edits within the current workspace.
sandbox_mode = "workspace-write"

# Optional hardening: disallow login shells for shell tools.
allow_login_shell = false


[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest", "--headless", "--browser", "chromium", "--isolated"]
enabled = true
startup_timeout_sec = 30
tool_timeout_sec = 120
default_tools_approval_mode = "prompt"
